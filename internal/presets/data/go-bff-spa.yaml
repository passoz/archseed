name: go-bff-spa
description: Go BFF + React SPA modular monolith with PostgreSQL, RabbitMQ, Redis, and MinIO. Uses sqlc for database access, net/http stdlib routing, and embedded React SPA served by the Go binary.
project:
  type: saas
  maturity: production
  repo: monorepo
features:
  frontend: true
  backend: true
  database: true
  cache: true
  queue: true
  storage: true
  auth: true
  workers: true
  docker: true
  github: true
  agents: true
  observability: true
stack:
  backend:
    language: go
    framework: net-http
    router: net-http
    orm: sqlc
    validation: go-playground-validator
    api_contract: openapi
  frontend:
    framework: react
    styling: tailwind
    build_tool: vite
    bff: go
  database:
    primary: postgres
    cache: redis
    object_storage: minio
  auth:
    provider: keycloak
    protocol: oidc
  messaging:
    provider: rabbitmq
  workers:
    enabled: true
    use_cases:
      - outbox
      - files
      - notifications
  observability:
    logs: structured
    stack: loki-grafana-prometheus
quality:
  tests:
    unit: required
    integration: required
    e2e: required
  ci:
    provider: github-actions
    required_checks:
      - lint
      - test
      - build
      - docker-build
  coverage:
    minimum_backend: 70
    minimum_frontend: 60
agents:
  enabled: true
  default_model_strategy:
    reasoning_heavy: deepseek-v4-pro
    complex_coding: deepseek-v4-flash
    medium_coding: opencode/big-pickle
    frontend_low_medium: opencode/minimax-m2.5-free
    file_ops: opencode/big-pickle
  require_plan_before_code: true
  require_tests_for_changes: true
  require_docs_update: true
